<form (submit)="updateKpiSettings($event)">
  <div class="flex flex-col gap-6">
      <div class="flex flex-col">
        <div class="w-full max-w-sm min-w-[160px]">
          <label class="block mb-2 text-sm dark:text-slate-300">Widget Name</label>
          <input
            type="text"
            [formField]="kpiForm.title"
            class="w-full bg-transparent dark:placeholder:text-slate-300 dark:text-white text-sm border border-slate-400 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-50 hover:border-slate-300 shadow-sm focus:shadow-md focus:!border-blue-300 focus:border-2"
            placeholder="Name of current widget"
          />
        </div>
      </div>
      <div class="flex flex-col">
        <div class="w-full max-w-sm min-w-[160px]">
          <label class="block mb-2 text-sm dark:text-slate-300">Refresh Rate</label>
          <input
            type="number"
            [formField]="kpiForm.refreshRate"
            class="w-full bg-transparent dark:placeholder:text-slate-300 dark:text-white text-sm border border-slate-400 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-50 hover:border-slate-300 shadow-sm focus:shadow-md focus:!border-blue-300 focus:border-2"
          />
        </div>
      </div>
      <button matButton="outlined" class="!border-blue-400 dark:!border-slate-400 dark:!text-white !rounded-xl dark:hover:!bg-slate-400">Submit</button>
  </div>
</form>
